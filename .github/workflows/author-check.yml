name: Author Email Validation

# Triggers the workflow on push events to all branches
on:
  push:
    # Use the wildcard to include all branches, including feature branches
    branches:
      - "**"

jobs:
  check-authorship:
    # Set the status check name for the Ruleset to require
    name: commit-author-check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code (This is the fix)
      - name: Checkout Repository History
        uses: actions/checkout@v4
        with:
          # CRITICAL FIX: Fetch the exact commit SHA being pushed.
          # This prevents the runner from using old, ghost references.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Step 2: Custom Script to Check Commit Authorship
      - name: Check Commit Authorship
        env:
          # Import the authorized email securely from repository secrets
          AUTHORIZED_EMAIL: ${{ secrets.AUTHORISED_EMAIL }}
        run: |
          # 1. Get the list of all new commits included in this push event
          COMMITS=$(git log --format="%H" "${{ github.event.before }}".."${{ github.sha }}")

          if [ -z "$COMMITS" ]; then
            echo "No new commits found in this push. Exiting successfully."
            exit 0
          fi

          echo "--- Checking ${#COMMITS[@]} commits in this push ---"

          # 2. Loop through each new commit
          for SHA in $COMMITS; do
            # Extract the author email for the specific commit SHA
            AUTHOR_EMAIL=$(git show -s --format='%ae' $SHA)
            
            echo "Checking commit $SHA by $AUTHOR_EMAIL"
            
            # 3. Compare the commit email against the secret
            if [ "$AUTHOR_EMAIL" != "$AUTHORIZED_EMAIL" ]; then
              echo "--------------------------------------------------------"
              echo "❌ PUSH FAILED: Unauthorized author email found in commit $SHA"
              echo "   Found Email: $AUTHOR_EMAIL"
              echo "   Expected Email: $AUTHORIZED_EMAIL"
              echo "   Push rejected by policy enforcement."
              echo "--------------------------------------------------------"
              exit 1 # Exit with error code to fail the workflow
            fi
          done

          echo "✅ All commit authors are authorized."
